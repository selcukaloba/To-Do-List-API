<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Workspace Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<!-- Top Navigation Header -->
<header class="w-full max-w-6xl mx-auto px-6 py-6 border-b border-zinc-200/60 flex justify-between items-center bg-zinc-50/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-zinc-900 rounded-md flex items-center justify-center">
            <div class="w-2.5 h-2.5 bg-white"></div>
        </div>
        <span class="font-semibold tracking-tight text-base text-zinc-900">todo.api</span>
        <span class="text-xs bg-zinc-200/60 text-zinc-700 px-2 py-0.5 rounded-full font-medium ml-2">Workspace</span>
    </div>

    <div class="flex items-center gap-4">
        <a href="/friends" class="text-xs text-zinc-500 hover:text-zinc-900 font-medium transition-colors">
            Friends & Sharing →
        </a>
        <button id="logoutBtn" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-white px-3 py-1.5 rounded-lg transition-all shadow-sm">
            Sign Out
        </button>
    </div>
</header>

<!-- Main Workspace Content -->
<main class="w-full max-w-6xl mx-auto px-6 py-8 flex-1">

    <!-- Workspace Title & Action Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-zinc-200/60">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-zinc-900">My Tasks</h1>
            <p class="text-xs text-zinc-500 mt-1">Manage, organize, and track your active tasks</p>
        </div>

        <button id="openModalBtn" class="bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-xs px-4 py-2.5 rounded-lg transition-all shadow-sm flex items-center gap-2 active:scale-[0.98]">
            <span>+ Create New Task</span>
        </button>
    </div>

    <!-- Error/Status Notification -->
    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border"></div>

    <!-- Todo List Grid Container -->
    <div id="todoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS ile buraya Todo Kartları eklenecek -->
    </div>

    <!-- Empty State (Yükleme veya Boş Durum) -->
    <div id="emptyState" class="hidden text-center py-16 border border-dashed border-zinc-300 rounded-2xl bg-white/50">
        <div class="w-10 h-10 bg-zinc-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span class="text-zinc-400 text-lg">✏️</span>
        </div>
        <h3 class="text-sm font-semibold text-zinc-900">No tasks found</h3>
        <p class="text-xs text-zinc-500 mt-1">Get started by creating a new task for your workspace.</p>
    </div>

</main>

<!-- Modal: Create Todo Form -->
<div id="todoModal" class="fixed inset-0 bg-zinc-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-zinc-200 rounded-2xl max-w-md w-full p-6 shadow-2xl transition-all">

        <div class="flex justify-between items-center mb-5">
            <h3 class="text-base font-semibold text-zinc-900">Create New Task</h3>
            <button id="closeModalBtn" class="text-zinc-400 hover:text-zinc-700 text-lg">&times;</button>
        </div>

        <form id="createTodoForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Title</label>
                <input type="text" id="todoTitle" required placeholder="Project documentation..." class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900" />
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Description</label>
                <textarea id="todoDescription" rows="2" placeholder="Task details..." class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900"></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Task Type</label>
                <select id="todoTaskType" required class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900">
                    <option value="WORK">WORK</option>
                    <option value="PERSONAL">PERSONAL</option>
                    <option value="URGENT">URGENT</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Due Date</label>
                    <input type="datetime-local" id="todoDueDate" required class="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Reminder Date</label>
                    <input type="datetime-local" id="todoReminderDate" class="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900" />
                </div>
            </div>

            <div class="pt-3 flex justify-end gap-2 border-t border-zinc-100">
                <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-medium rounded-lg transition-all">Cancel</button>
                <button type="submit" id="saveTodoBtn" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium rounded-lg transition-all">Save Task</button>
            </div>
        </form>
    </div>
</div>

<footer class="w-full max-w-6xl mx-auto px-6 py-6 text-center border-t border-zinc-200/60 mt-12">
    <p class="text-xs text-zinc-400">© 2026 Todo API Inc. Workspace Dashboard</p>
</footer>

<!-- SCRIPT: API Integration -->
<script>
    const token = localStorage.getItem('accessToken');

    // 1. Auth Guard: Token yoksa login'e at
    if (!token) {
        window.location.href = '/login';
    }

    // Modal Kontrolleri
    const todoModal = document.getElementById('todoModal');
    document.getElementById('openModalBtn').addEventListener('click', () => todoModal.classList.remove('hidden'));
    document.getElementById('closeModalBtn').addEventListener('click', () => todoModal.classList.add('hidden'));
    document.getElementById('cancelModalBtn').addEventListener('click', () => todoModal.classList.add('hidden'));

    // Logout İşlemi
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('accessToken');
        window.location.href = '/login';
    });

    // ISO Tarih Formatı Dönüştürücü ("YYYY-MM-DD HH:mm:ss")
    function formatToBackendDate(datetimeLocalValue) {
        if (!datetimeLocalValue) return null;
        return datetimeLocalValue.replace('T', ' ') + ':00';
    }

    // 2. Todoları Yükleme (GET All Todos)
    async function loadTodos() {
        const grid = document.getElementById('todoGrid');
        const emptyState = document.getElementById('emptyState');

        try {
            const response = await fetch('/rest/api/todo/getAllTodo', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401) {
                localStorage.removeItem('accessToken');
                window.location.href = '/login';
                return;
            }

            const resData = await response.json();
            const todos = resData.payload || resData;

            grid.innerHTML = '';

            if (!todos || todos.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            todos.forEach(todo => {
                const card = document.createElement('div');
                card.className = "bg-white border border-zinc-200/80 rounded-xl p-5 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)] hover:border-zinc-300 transition-all flex flex-col justify-between";

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-100 text-zinc-700 rounded-md">${todo.taskType || 'TASK'}</span>
                            <button onclick="deleteTodo(${todo.id})" class="text-xs text-zinc-400 hover:text-red-600 transition-colors">Delete</button>
                        </div>
                        <h4 class="font-semibold text-sm text-zinc-900 mb-1">${todo.title}</h4>
                        <p class="text-xs text-zinc-500 mb-4 line-clamp-2">${todo.description || 'No description provided.'}</p>
                    </div>
                    <div class="pt-3 border-t border-zinc-100 flex justify-between items-center text-[11px] text-zinc-400">
                        <span>Due: ${todo.dueDate ? todo.dueDate.replace('T', ' ') : 'N/A'}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (err) {
            console.error('Error fetching todos:', err);
        }
    }

    // 3. Yeni Todo Oluşturma (POST Create Todo)
    document.getElementById('createTodoForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            title: document.getElementById('todoTitle').value.trim(),
            description: document.getElementById('todoDescription').value.trim(),
            taskType: document.getElementById('todoTaskType').value,
            dueDate: formatToBackendDate(document.getElementById('todoDueDate').value),
            reminderDate: formatToBackendDate(document.getElementById('todoReminderDate').value)
        };

        try {
            const response = await fetch('/rest/api/todo/create', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                todoModal.classList.add('hidden');
                document.getElementById('createTodoForm').reset();
                loadTodos(); // Listeyi yenile
            } else {
                alert(data.exceptionDetails?.message || 'Error creating task.');
            }
        } catch (err) {
            console.error('Create todo error:', err);
        }
    });

    // 4. Todo Silme
    async function deleteTodo(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;

        try {
            const response = await fetch('/rest/api/todo/delete/' + id, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                loadTodos();
            } else {
                alert('Could not delete task.');
            }
        } catch (err) {
            console.error('Delete error:', err);
        }
    }

    // Sayfa Yüklendiğinde Todoları Getir
    loadTodos();
</script>

</body>
</html>
