<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Workspace Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<header class="w-full max-w-6xl mx-auto px-6 py-6 border-b border-zinc-200/60 flex justify-between items-center bg-zinc-50/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-zinc-900 rounded-md flex items-center justify-center">
            <div class="w-2.5 h-2.5 bg-white"></div>
        </div>
        <span class="font-semibold tracking-tight text-base text-zinc-900">todo.api</span>
        <span class="text-xs bg-zinc-200/60 text-zinc-700 px-2 py-0.5 rounded-full font-medium ml-2">Workspace</span>
    </div>

    <div class="flex items-center gap-4">
        <a href="/friends" class="text-xs text-zinc-500 hover:text-zinc-900 font-medium transition-colors">
            Friends & Sharing →
        </a>
        <button id="logoutBtn" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-white px-3 py-1.5 rounded-lg transition-all shadow-sm">
            Sign Out
        </button>
    </div>
</header>

<main class="w-full max-w-6xl mx-auto px-6 py-8 flex-1">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-zinc-200/60">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-zinc-900">My Tasks</h1>
            <p class="text-xs text-zinc-500 mt-1">Manage, organize, and track your active tasks</p>
        </div>

        <div class="flex gap-2 items-center">
            <!-- Dinamik Gün Seçici -->
            <div class="flex items-center gap-2 bg-white border border-zinc-200 px-3 py-1.5 rounded-lg shadow-sm">
                <span class="text-xs text-zinc-500 font-medium">Days:</span>
                <input type="number" id="upcomingsDays" value="7" min="1" max="365" class="w-12 text-xs font-semibold text-zinc-900 bg-zinc-50 border border-zinc-200 rounded p-1 text-center focus:outline-none focus:border-zinc-900" />
            </div>

            <button id="toggleUpcomingsBtn" class="bg-white border border-zinc-200 text-zinc-700 hover:bg-zinc-50 font-medium text-xs px-4 py-2.5 rounded-lg transition-all shadow-sm active:scale-[0.98]">
                <span>📅 Upcomings</span>
            </button>
            <button onclick="openModal()" class="bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-xs px-4 py-2.5 rounded-lg transition-all shadow-sm active:scale-[0.98]">
                <span>+ Create Task</span>
            </button>
        </div>
    </div>

    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border"></div>

    <div id="todoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS Dynamic Content -->
    </div>

    <div id="emptyState" class="hidden text-center py-16 border border-dashed border-zinc-300 rounded-2xl bg-white/50">
        <div class="w-10 h-10 bg-zinc-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span class="text-zinc-400 text-lg">✏️</span>
        </div>
        <h3 id="emptyStateTitle" class="text-sm font-semibold text-zinc-900">No tasks found</h3>
        <p class="text-xs text-zinc-500 mt-1">Get started by creating a new task for your workspace.</p>
    </div>
</main>

<!-- Modal: Create / Update Todo Form -->
<div id="todoModal" class="fixed inset-0 bg-zinc-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-zinc-200 rounded-2xl max-w-md w-full p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center mb-5">
            <h3 id="modalTitle" class="text-base font-semibold text-zinc-900">Create New Task</h3>
            <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-700 text-lg">&times;</button>
        </div>
        <form id="todoForm" class="space-y-4">
            <input type="hidden" id="todoId" value="" />
            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Title</label>
                <input type="text" id="todoTitle" required minlength="3" maxlength="100" placeholder="Task title..." class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900" />
            </div>
            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Description</label>
                <textarea id="todoDescription" rows="2" placeholder="Task details..." class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900"></textarea>
            </div>
            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Task Type</label>
                <select id="todoTaskType" required class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900">
                    <option value="WORK">WORK</option>
                    <option value="SCHOOL">SCHOOL</option>
                    <option value="LIFESTYLE">LIFESTYLE</option>
                    <option value="HEALTH">HEALTH</option>
                    <option value="LEISURE">LEISURE</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Due Date</label>
                    <input type="datetime-local" id="todoDueDate" required class="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Reminder Date</label>
                    <input type="datetime-local" id="todoReminderDate" required class="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900" />
                </div>
            </div>
            <div id="completedWrapper" class="hidden flex items-center mt-2">
                <input type="checkbox" id="todoCompleted" class="w-4 h-4 text-zinc-900 bg-zinc-50 border-zinc-300 rounded focus:ring-zinc-900 focus:ring-2" />
                <label for="todoCompleted" class="ml-2 text-xs font-medium text-zinc-700">Mark as completed</label>
            </div>
            <div class="pt-3 flex justify-end gap-2 border-t border-zinc-100">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-medium rounded-lg transition-all">Cancel</button>
                <button type="submit" id="saveBtn" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium rounded-lg transition-all">Save Task</button>
            </div>
        </form>
    </div>
</div>

<footer class="w-full max-w-6xl mx-auto px-6 py-6 text-center border-t border-zinc-200/60 mt-12">
    <p class="text-xs text-zinc-400">© 2026 Todo API Inc. Workspace Dashboard</p>
</footer>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = '/login';

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('accessToken');
        window.location.href = '/login';
    });

    let currentTodos = [];
    let isShowingUpcomings = false;

    const API_TODO_CREATE = '/rest/api/todo/create';
    const API_TODO_ALL = '/rest/api/todo/all';
    const API_TODO_UPDATE = '/rest/api/todo/update/';
    const API_TODO_DELETE = '/rest/api/todo/delete/';
    const API_TODO_UPCOMINGS = '/rest/api/todo/upcomings?days=7';

    function formatToBackendDate(dt) {
        if (!dt) return null;
        return dt.length === 16 ? dt.replace('T', ' ') + ':00' : dt.replace('T', ' ');
    }

    function formatToFrontendDate(dt) {
        if (!dt) return '';
        return dt.replace(' ', 'T').substring(0, 16);
    }

    function showStatus(message, isError = false) {
        const banner = document.getElementById('statusBanner');
        banner.classList.remove('hidden');
        banner.className = isError
            ? "mb-6 p-4 rounded-xl text-xs font-medium bg-red-50 border border-red-200 text-red-600"
            : "mb-6 p-4 rounded-xl text-xs font-medium bg-emerald-50 border border-emerald-200 text-emerald-700";
        banner.textContent = message;
        setTimeout(() => banner.classList.add('hidden'), 4000);
    }

    async function loadTodos(fetchUpcomings = false) {
        const grid = document.getElementById('todoGrid');
        const emptyState = document.getElementById('emptyState');
        const emptyTitle = document.getElementById('emptyStateTitle');

        // Dinamik Endpoint Oluşturma
        let endpoint = API_TODO_ALL;
        let requestedDays = 7; // Default

        if (fetchUpcomings) {
            requestedDays = document.getElementById('upcomingsDays').value || 7;
            endpoint = `/rest/api/todo/upcomings?days=${requestedDays}`; // Sabit const yerine dinamik yapı
        }

        try {
            const response = await fetch(endpoint, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const data = await response.json();
                currentTodos = Array.isArray(data) ? data : (data.payload || []);
                grid.innerHTML = '';

                if (currentTodos.length === 0) {
                    emptyTitle.textContent = fetchUpcomings ? `No upcoming tasks in ${requestedDays} days` : "No tasks found";
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                currentTodos.forEach(todo => {
        const isCompleted = todo.completed || todo.isCompleted;
        const cardClass = isCompleted
            ? "bg-zinc-50 border border-zinc-200 rounded-xl p-5 shadow-sm opacity-60"
            : "bg-white border border-zinc-200/80 rounded-xl p-5 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)] hover:border-zinc-300 transition-all";

        const card = document.createElement('div');
        card.className = cardClass + " flex flex-col justify-between";

        let sharedBadge = '';
        if (todo.ownerUsername) {
             sharedBadge = `<span class="text-[10px] ml-2 font-medium bg-blue-50 text-blue-600 px-2 py-0.5 rounded border border-blue-100 shadow-sm">
                                👤 from ${todo.ownerUsername}
                            </span>`;
        }

        card.innerHTML = `
            <div>
                <div class="flex justify-between items-start mb-2">
                    <div class="flex items-center">
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-100 text-zinc-700 rounded-md">
                            ${todo.taskType}
                        </span>
                        ${sharedBadge}
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openModal(${todo.id})" class="text-xs text-zinc-400 hover:text-zinc-900 transition-colors">Edit</button>
                        <button onclick="deleteTodo(${todo.id})" class="text-xs text-zinc-400 hover:text-red-600 transition-colors">Del</button>
                    </div>
                </div>
                <h4 class="font-semibold text-sm text-zinc-900 mb-1 ${isCompleted ? 'line-through' : ''}">${todo.title}</h4>
                <p class="text-xs text-zinc-500 mb-4 line-clamp-2">${todo.description || 'No description provided.'}</p>
            </div>
            <div class="pt-3 border-t border-zinc-100 flex flex-col gap-1 text-[11px] text-zinc-400">
                <span>🎯 Due: <strong class="text-zinc-600">${todo.dueDate || 'N/A'}</strong></span>
                <span>⏰ Rem: ${todo.reminderDate || 'N/A'}</span>
            </div>
        `;
        grid.appendChild(card);
    });
            }
        } catch (err) {
            showStatus("Error loading tasks.", true);
        }
    }

    // --- TOGGLE UPCOMINGS ---
    document.getElementById('toggleUpcomingsBtn').addEventListener('click', (e) => {
        isShowingUpcomings = !isShowingUpcomings;
        const btn = e.currentTarget;
        const daysInput = document.getElementById('upcomingsDays');

        if (isShowingUpcomings) {
            btn.classList.add('bg-zinc-900', 'text-white', 'border-zinc-900');
            btn.classList.remove('bg-white', 'text-zinc-700');
            btn.innerHTML = '<span>🔙 Show All Tasks</span>';

            // Kullanıcı upcomings içindeyken input'u kilitleyelim ki mantık hatası olmasın
            daysInput.disabled = true;
            daysInput.classList.add('opacity-50');
        } else {
            btn.classList.remove('bg-zinc-900', 'text-white', 'border-zinc-900');
            btn.classList.add('bg-white', 'text-zinc-700');
            btn.innerHTML = '<span>📅 Upcomings</span>';

            // All Tasks'e dönünce kilidi açalım
            daysInput.disabled = false;
            daysInput.classList.remove('opacity-50');
        }
        loadTodos(isShowingUpcomings);
    });

    const todoModal = document.getElementById('todoModal');
    const todoForm = document.getElementById('todoForm');

    window.openModal = function(id = null) {
        todoForm.reset();
        document.getElementById('todoId').value = '';
        document.getElementById('completedWrapper').classList.add('hidden');
        document.getElementById('todoCompleted').checked = false;

        if (id) {
            document.getElementById('modalTitle').textContent = 'Edit Task';
            const todo = currentTodos.find(t => t.id === id);
            if (todo) {
                document.getElementById('todoId').value = todo.id;
                document.getElementById('todoTitle').value = todo.title;
                document.getElementById('todoDescription').value = todo.description || '';
                document.getElementById('todoTaskType').value = todo.taskType;
                document.getElementById('todoDueDate').value = formatToFrontendDate(todo.dueDate);
                document.getElementById('todoReminderDate').value = formatToFrontendDate(todo.reminderDate);

                document.getElementById('completedWrapper').classList.remove('hidden');
                document.getElementById('todoCompleted').checked = todo.completed || todo.isCompleted || false;
            }
        } else {
            document.getElementById('modalTitle').textContent = 'Create New Task';
        }
        todoModal.classList.remove('hidden');
    };

    window.closeModal = function() {
        todoModal.classList.add('hidden');
    };

    todoForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('todoId').value;
        const isUpdate = !!id;

        const payload = {
            title: document.getElementById('todoTitle').value.trim(),
            description: document.getElementById('todoDescription').value.trim(),
            taskType: document.getElementById('todoTaskType').value,
            dueDate: formatToBackendDate(document.getElementById('todoDueDate').value),
            reminderDate: formatToBackendDate(document.getElementById('todoReminderDate').value)
        };

        if (isUpdate) {
            payload.isCompleted = document.getElementById('todoCompleted').checked;
        }

        const endpoint = isUpdate ? API_TODO_UPDATE + id : API_TODO_CREATE;
        const method = isUpdate ? 'PUT' : 'POST';

        const submitBtn = document.getElementById('saveBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        try {
            const response = await fetch(endpoint, {
                method: method,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showStatus(`Task ${isUpdate ? 'updated' : 'created'} successfully!`);
                closeModal();
                loadTodos(isShowingUpcomings);
            } else {
                const data = await response.json().catch(() => null);
                let errorMsg = "Error saving task.";

                if (data) {
                    // Backend'den gelen raw mesajı al
                    let rawMessage = data.exceptionDetails?.message || data.message || data.error;

                    if (typeof rawMessage === 'string') {
                        errorMsg = rawMessage;
                    } else if (typeof rawMessage === 'object' && rawMessage !== null) {
                        // Eğer obje dönerse (Spring Validation Map gibi), içindeki tüm değerleri araya | koyarak birleştir
                        errorMsg = Object.values(rawMessage).join(' | ');
                    } else if (data.errors && Array.isArray(data.errors)) {
                        // Default Spring Boot hata listesi için
                        errorMsg = data.errors.map(err => err.defaultMessage || err).join(' | ');
                    } else {
                        // Hâlâ yakalayamadıysak JSON'ı direkt metne çevirerek bas (Object object'ten kurtarır)
                        errorMsg = JSON.stringify(data);
                    }
                }

                showStatus(errorMsg, true);
            }
        } catch (err) {
            showStatus("Network error occurred.", true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Save Task';
        }
    });

    window.deleteTodo = async function(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;

        try {
            const response = await fetch(API_TODO_DELETE + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                showStatus("Task deleted successfully!");
                loadTodos(isShowingUpcomings);
            } else {
                showStatus("Failed to delete task.", true);
            }
        } catch (err) {
            showStatus("Network error occurred.", true);
        }
    };

    loadTodos();
</script>

</body>
</html>
