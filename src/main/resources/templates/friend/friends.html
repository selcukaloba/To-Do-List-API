<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Friends & Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<header class="w-full max-w-6xl mx-auto px-6 py-6 border-b border-zinc-200/60 flex justify-between items-center bg-zinc-50/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-zinc-900 rounded-md flex items-center justify-center">
            <div class="w-2.5 h-2.5 bg-white"></div>
        </div>
        <span class="font-semibold tracking-tight text-base text-zinc-900">todo.api</span>
        <span class="text-xs bg-zinc-200/60 text-zinc-700 px-2 py-0.5 rounded-full font-medium ml-2">Network & Sharing</span>
    </div>

    <div class="flex items-center gap-4">
        <a href="/dashboard" class="text-xs text-zinc-500 hover:text-zinc-900 font-medium transition-colors">
            ← Back to Dashboard
        </a>
        <button id="logoutBtn" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-white px-3 py-1.5 rounded-lg transition-all shadow-sm">
            Sign Out
        </button>
    </div>
</header>

<main class="w-full max-w-6xl mx-auto px-6 py-8 flex-1">

    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <div class="space-y-6">

            <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
                <h3 class="text-sm font-semibold text-zinc-900 mb-1">Add Friend</h3>
                <form id="addFriendForm" class="space-y-3 mt-4">
                    <input type="text" id="friendUsername" required placeholder="username" class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900" />
                    <button type="submit" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium py-2 rounded-lg transition-all shadow-sm">
                        Send Friend Request
                    </button>
                </form>
            </div>

            <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-zinc-900">Friend Requests</h3>
                    <span id="pendingFriendCount" class="text-[10px] bg-zinc-100 text-zinc-600 px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <div id="pendingFriendList" class="space-y-3 text-xs text-zinc-500">
                    <p class="text-zinc-400 italic">No pending requests.</p>
                </div>
            </div>

            <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
                <h3 class="text-sm font-semibold text-zinc-900 mb-4">Your Network</h3>
                <div id="friendsList" class="space-y-2 text-xs text-zinc-500">
                    <p class="text-zinc-400 italic">Loading friends...</p>
                </div>
            </div>

        </div>

        <div class="lg:col-span-2 space-y-6">

            <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
                <h3 class="text-sm font-semibold text-zinc-900 mb-4">Share a Task</h3>
                <form id="shareTaskForm" class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                    <div class="sm:col-span-2">
                        <select id="todoSelect" required class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900">
                            <option value="">Select a task...</option>
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <select id="friendSelect" required class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-xs text-zinc-900 focus:outline-none focus:border-zinc-900">
                            <option value="">Select a friend...</option>
                        </select>
                    </div>
                    <div class="sm:col-span-1">
                        <button type="submit" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium py-2.5 rounded-lg transition-all shadow-sm">
                            Share
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-zinc-900">Task Invitations</h3>
                    <span id="pendingShareCount" class="text-[10px] bg-zinc-100 text-zinc-600 px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <div id="pendingShareList" class="space-y-3 text-xs text-zinc-500">
                    <p class="text-zinc-400 italic">No pending task invitations.</p>
                </div>
            </div>

            <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-sm font-semibold text-zinc-900">Shared Workspace</h3>
                        <p class="text-xs text-zinc-500 mt-0.5">Tasks actively shared with you</p>
                    </div>
                </div>

                <div id="sharedTodoGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>

                <div id="noSharedTodos" class="hidden text-center py-12 border border-dashed border-zinc-200 rounded-xl">
                    <p class="text-xs text-zinc-400">No shared tasks found.</p>
                </div>
            </div>

        </div>

    </div>
</main>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = '/login';

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('accessToken');
        window.location.href = '/login';
    });

    const statusBanner = document.getElementById('statusBanner');
    function showStatus(message, isError = false) {
        statusBanner.classList.remove('hidden');
        if (isError) {
            statusBanner.className = "mb-6 p-4 rounded-xl text-xs font-medium bg-red-50 border border-red-200 text-red-600";
        } else {
            statusBanner.className = "mb-6 p-4 rounded-xl text-xs font-medium bg-emerald-50 border border-emerald-200 text-emerald-700";
        }
        statusBanner.textContent = message;
        setTimeout(() => statusBanner.classList.add('hidden'), 5000);
    }

    const API_FRIEND_SEND = '/friends/request/send';
    const API_FRIEND_PENDING = '/friends/request/pending';
    const API_FRIEND_ACCEPT = '/friends/request/accept/';
    const API_FRIEND_REJECT = '/friends/request/delete/';
    const API_FRIEND_LIST = '/friends/list';

    const API_TODO_ALL = '/rest/api/todo/all'; // Tüm görevleri çekmek için ana uç nokta
    const API_SHARE_SEND = '/rest/api/todo/share/';
    const API_SHARE_PENDING = '/rest/api/todo/share/pending';
    const API_SHARE_ACCEPT = '/rest/api/todo/share/accept/';
    const API_SHARE_REJECT = '/rest/api/todo/share/reject/';

    document.getElementById('addFriendForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('friendUsername').value.trim();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        try {
            const response = await fetch(`${API_FRIEND_SEND}?receiverUsername=${username}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                showStatus("Friend request sent!");
                document.getElementById('friendUsername').value = '';
            } else {
                const data = await response.json().catch(() => null);
                showStatus(data?.exceptionDetails?.message || "Failed to send request.", true);
            }
        } catch (err) {
            showStatus("Network error occurred.", true);
        } finally {
            submitBtn.disabled = false;
        }
    });

    async function loadFriendRequests() {
        try {
            const response = await fetch(API_FRIEND_PENDING, { headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                const data = await response.json();
                const requests = Array.isArray(data) ? data : (data.payload || []);
                const list = document.getElementById('pendingFriendList');
                document.getElementById('pendingFriendCount').textContent = requests.length;

                list.innerHTML = '';
                if (requests.length === 0) {
                    list.innerHTML = '<p class="text-zinc-400 italic">No pending requests.</p>';
                    return;
                }
                requests.forEach(req => {
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-2.5 bg-white border border-zinc-200 rounded-lg shadow-sm">
                            <span class="font-medium text-zinc-800">${req.senderUsername}</span>
                            <div class="flex gap-1.5">
                                <button onclick="respondFriendRequest(${req.id}, 'accept')" class="bg-zinc-900 text-white px-2.5 py-1 rounded-md text-[10px] font-medium transition-all">Accept</button>
                                <button onclick="respondFriendRequest(${req.id}, 'reject')" class="bg-red-50 text-red-600 px-2.5 py-1 rounded-md text-[10px] font-medium transition-all">Reject</button>
                            </div>
                        </div>`;
                });
            }
        } catch (err) {}
    }

    window.respondFriendRequest = async function(id, action) {
        const url = action === 'accept' ? API_FRIEND_ACCEPT + id : API_FRIEND_REJECT + id;
        const method = action === 'accept' ? 'POST' : 'DELETE';
        try {
            const response = await fetch(url, { method: method, headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                showStatus(`Friend request ${action}ed!`);
                loadFriendRequests();
                loadFriendsAndPopulateDropdown();
            }
        } catch (err) {}
    }

    async function loadFriendsAndPopulateDropdown() {
        const list = document.getElementById('friendsList');
        const select = document.getElementById('friendSelect');
        try {
            const response = await fetch(API_FRIEND_LIST, { headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                const data = await response.json();
                const friends = Array.isArray(data) ? data : (data.payload || []);

                list.innerHTML = '';
                select.innerHTML = '<option value="">Select a friend...</option>';

                if (friends.length === 0) {
                    list.innerHTML = '<p class="text-zinc-400 italic">No friends added yet.</p>';
                    return;
                }

                friends.forEach(f => {
                    const friendName = typeof f === 'object' ? (f.username || f.receiverUsername || f.senderUsername) : f;
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-2.5 bg-zinc-50 border border-zinc-200/60 rounded-lg">
                            <span class="font-medium text-zinc-800">${friendName}</span>
                            <span class="text-[10px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">Friend</span>
                        </div>`;
                    select.innerHTML += `<option value="${friendName}">${friendName}</option>`;
                });
            }
        } catch (err) {}
    }

    async function loadMyTodosForDropdown() {
        const select = document.getElementById('todoSelect');
        try {
            const response = await fetch(API_TODO_ALL, { headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                const data = await response.json();
                const todos = Array.isArray(data) ? data : (data.payload || []);

                select.innerHTML = '<option value="">Select a task...</option>';
                todos.forEach(todo => {
                    if(!todo.isCompleted && !todo.completed) {
                        select.innerHTML += `<option value="${todo.id}">${todo.title}</option>`;
                    }
                });
            }
        } catch (err) {}
    }

    document.getElementById('shareTaskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const todoId = document.getElementById('todoSelect').value;
        const friendUsername = document.getElementById('friendSelect').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        try {
            const response = await fetch(`${API_SHARE_SEND}${todoId}?friendUsername=${friendUsername}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                showStatus("Task share invitation sent!");
                document.getElementById('shareTaskForm').reset();
            } else {
                const data = await response.json().catch(() => null);
                showStatus(data?.exceptionDetails?.message || "Failed to share task.", true);
            }
        } catch (err) {
            showStatus("Network error occurred.", true);
        } finally {
            submitBtn.disabled = false;
        }
    });

    async function loadPendingShareRequests() {
        try {
            const response = await fetch(API_SHARE_PENDING, { headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                const data = await response.json();
                const requests = Array.isArray(data) ? data : (data.payload || []);
                const list = document.getElementById('pendingShareList');
                document.getElementById('pendingShareCount').textContent = requests.length;

                list.innerHTML = '';
                if (requests.length === 0) {
                    list.innerHTML = '<p class="text-zinc-400 italic">No pending task invitations.</p>';
                    return;
                }

                requests.forEach(req => {
                    list.innerHTML += `
                        <div class="flex flex-col gap-2 p-3 bg-white border border-zinc-200 rounded-lg shadow-sm">
                            <p class="text-xs text-zinc-600"><strong class="text-zinc-900">${req.senderUsername}</strong> wants to share <strong class="text-zinc-900">"${req.todoTitle}"</strong></p>
                            <div class="flex gap-1.5 justify-end mt-1">
                                <button onclick="respondShareRequest(${req.id}, 'accept')" class="bg-zinc-900 text-white px-3 py-1 rounded-md text-[10px] font-medium transition-all">Accept</button>
                                <button onclick="respondShareRequest(${req.id}, 'reject')" class="bg-red-50 text-red-600 px-3 py-1 rounded-md text-[10px] font-medium transition-all">Reject</button>
                            </div>
                        </div>`;
                });
            }
        } catch (err) {}
    }

    window.respondShareRequest = async function(id, action) {
        const url = action === 'accept' ? API_SHARE_ACCEPT + id : API_SHARE_REJECT + id;
        try {
            const response = await fetch(url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                showStatus(`Task invitation ${action}ed!`);
                loadPendingShareRequests();
                loadSharedTodos(); // Kabul edildikten sonra listeyi güncelle
            }
        } catch (err) {}
    }

    async function loadSharedTodos() {
        const grid = document.getElementById('sharedTodoGrid');
        const emptyState = document.getElementById('noSharedTodos');
        try {

            const response = await fetch(API_TODO_ALL, { headers: { 'Authorization': 'Bearer ' + token } });
            if (response.ok) {
                const data = await response.json();
                let allTasks = Array.isArray(data) ? data : (data.payload || []);

                let sharedTasks = allTasks.filter(todo => todo.ownerUsername);

                grid.innerHTML = '';
                if (sharedTasks.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                sharedTasks.forEach(todo => {
                    const isCompleted = todo.completed || todo.isCompleted;
                    grid.innerHTML += `
                        <div class="bg-zinc-50 border border-zinc-200 rounded-xl p-4 flex flex-col justify-between ${isCompleted ? 'opacity-60' : ''}">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-200/80 text-zinc-700 rounded">${todo.taskType}</span>

                                    <span class="text-[10px] bg-blue-50 text-blue-600 border border-blue-200 px-2 py-0.5 rounded-md font-medium shadow-sm">
                                        👤 from ${todo.ownerUsername}
                                    </span>
                                </div>
                                <h4 class="font-semibold text-xs text-zinc-900 mb-1 ${isCompleted ? 'line-through' : ''}">${todo.title}</h4>
                                <p class="text-[11px] text-zinc-500 mb-3">${todo.description || 'No description'}</p>
                            </div>
                            <div class="pt-2 border-t border-zinc-200/60 text-[10px] text-zinc-400">
                                <span>Due: <strong class="text-zinc-600">${todo.dueDate || 'N/A'}</strong></span>
                            </div>
                        </div>
                    `;
                });
            }
        } catch (err) {
            emptyState.classList.remove('hidden');
        }
    }

    loadFriendRequests();
    loadFriendsAndPopulateDropdown();
    loadMyTodosForDropdown();
    loadPendingShareRequests();
    loadSharedTodos();
</script>

</body>
</html>
