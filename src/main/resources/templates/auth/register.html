<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Create Account</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<!-- Top Minimalist Header / Brand -->
<header class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center">
    <div class="flex items-center gap-2">
        <!-- Sleek Minimal Logo -->
        <div class="w-5 h-5 bg-zinc-900 rounded-sm flex items-center justify-center">
            <div class="w-2 h-2 bg-white rounded-none"></div>
        </div>
        <span class="font-semibold tracking-tight text-sm text-zinc-900">todo.api</span>
    </div>
    <a href="/login" class="text-xs text-zinc-500 hover:text-zinc-900 transition-colors duration-150">
        Already have an account? <span class="text-zinc-900 font-medium">Sign In →</span>
    </a>
</header>

<!-- Main Auth Card Container -->
<main class="w-full max-w-md mx-auto px-4 my-auto">
    <div class="bg-white border border-zinc-200/80 rounded-2xl p-8 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] transition-all">

        <!-- Header Text -->
        <div class="mb-6">
            <h1 class="text-xl font-semibold tracking-tight text-zinc-900">Create an account</h1>
            <p class="text-xs text-zinc-500 mt-1">Start organizing your workspace efficiently</p>
        </div>

        <!-- Hata & Başarı Bildirim Kutusu -->
        <div id="statusBanner" class="hidden mb-4 p-3 rounded-lg text-xs font-medium">
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="space-y-4">
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-xs font-medium text-zinc-700 mb-1.5">Username</label>
                <input type="text"
                       id="username"
                       required
                       placeholder="johndoe"
                       class="w-full px-3.5 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-900 transition-all duration-150" />
            </div>

            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-medium text-zinc-700 mb-1.5">Email Address</label>
                <input type="email"
                       id="email"
                       required
                       placeholder="john@example.com"
                       class="w-full px-3.5 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-900 transition-all duration-150" />
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-medium text-zinc-700 mb-1.5">Password</label>
                <input type="password"
                       id="password"
                       required
                       placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-900 transition-all duration-150" />
            </div>

            <!-- Primary Action Button -->
            <button type="submit"
                    id="submitBtn"
                    class="w-full mt-2 bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-sm py-2.5 rounded-lg transition-all duration-150 active:scale-[0.99] shadow-sm flex justify-center items-center">
                <span>Create Account</span>
            </button>
        </form>

    </div>
</main>

<!-- Footer -->
<footer class="w-full max-w-5xl mx-auto px-6 py-6 text-center">
    <p class="text-xs text-zinc-400">© 2026 Todo API Inc. All rights reserved.</p>
</footer>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value.trim();
        const emailInput = document.getElementById('email').value.trim();
        const passwordInput = document.getElementById('password').value;
        const statusBanner = document.getElementById('statusBanner');
        const submitBtn = document.getElementById('submitBtn');

        // Reset Banner
        statusBanner.className = 'hidden mb-4 p-3 rounded-lg text-xs font-medium';
        statusBanner.textContent = '';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Creating Account...</span>';

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    email: emailInput,
                    password: passwordInput
                })
            });

            const data = await response.json();

            if (response.ok) {
                statusBanner.textContent = 'Account created successfully! Redirecting to sign in...';
                statusBanner.classList.add('bg-emerald-50', 'border', 'border-emerald-200/80', 'text-emerald-700');
                statusBanner.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                let errorMsg = 'Failed to create account.';
                if (data.exceptionDetails && data.exceptionDetails.message) {
                    errorMsg = typeof data.exceptionDetails.message === 'string'
                        ? data.exceptionDetails.message
                        : JSON.stringify(data.exceptionDetails.message);
                } else if (data.message) {
                    errorMsg = data.message;
                }

                statusBanner.textContent = errorMsg;
                statusBanner.classList.add('bg-red-50', 'border', 'border-red-200/80', 'text-red-600');
                statusBanner.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Register error:', error);
            statusBanner.textContent = 'Connection error. Please try again later.';
            statusBanner.classList.add('bg-red-50', 'border', 'border-red-200/80', 'text-red-600');
            statusBanner.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Create Account</span>';
        }
    });
</script>

</body>
</html>
