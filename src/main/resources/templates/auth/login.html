<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Sign In</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<!-- Top Minimalist Header / Brand -->
<header class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center">
    <div class="flex items-center gap-2">
        <!-- Sleek Minimal Logo -->
        <div class="w-5 h-5 bg-zinc-900 rounded-sm flex items-center justify-center">
            <div class="w-2 h-2 bg-white rounded-none"></div>
        </div>
        <span class="font-semibold tracking-tight text-sm text-zinc-900">todo.api</span>
    </div>
    <a href="/register" class="text-xs text-zinc-500 hover:text-zinc-900 transition-colors duration-150">
        Don't have an account? <span class="text-zinc-900 font-medium">Sign Up →</span>
    </a>
</header>

<!-- Main Auth Card Container -->
<main class="w-full max-w-md mx-auto px-4 my-auto">
    <div class="bg-white border border-zinc-200/80 rounded-2xl p-8 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] transition-all">

        <!-- Header Text -->
        <div class="mb-6">
            <h1 class="text-xl font-semibold tracking-tight text-zinc-900">Welcome</h1>
            <p class="text-xs text-zinc-500 mt-1">Enter your credentials to access your workspace</p>
        </div>

        <!-- Hata Bildirim Kutusu (Varsayılan olarak gizli) -->
        <div id="errorBanner" class="hidden mb-4 p-3 bg-red-50 border border-red-200/80 rounded-lg text-xs text-red-600 font-medium">
        </div>

        <!-- Auth Form -->
        <form id="loginForm" class="space-y-4">
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-xs font-medium text-zinc-700 mb-1.5">Username</label>
                <input type="text"
                       id="username"
                       required
                       placeholder="username"
                       class="w-full px-3.5 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-900 transition-all duration-150" />
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-xs font-medium text-zinc-700">Password</label>
                </div>
                <input type="password"
                       id="password"
                       required
                       placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-900 transition-all duration-150" />
            </div>

            <!-- Primary Action Button -->
            <button type="submit"
                    id="submitBtn"
                    class="w-full mt-2 bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-sm py-2.5 rounded-lg transition-all duration-150 active:scale-[0.99] shadow-sm flex justify-center items-center">
                <span>Continue</span>
            </button>
        </form>

    </div>
</main>

<!-- Footer -->
<footer class="w-full max-w-5xl mx-auto px-6 py-6 text-center">
    <p class="text-xs text-zinc-400">© 2026 Todo API Inc. All rights reserved.</p>
</footer>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const errorBanner = document.getElementById('errorBanner');
        const submitBtn = document.getElementById('submitBtn');

        // Temizlik
        errorBanner.classList.add('hidden');
        errorBanner.textContent = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Processing...</span>';

        try {
            const response = await fetch('/auth/authenticate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Token alma garantisi
                let token = null;
                if (data.accessToken) {
                    token = data.accessToken;
                } else if (data.token) {
                    token = data.token;
                } else if (data.payload && data.payload.accessToken) {
                    token = data.payload.accessToken;
                }

                if (token) {
                    localStorage.setItem('accessToken', token);
                    window.location.href = '/dashboard';
                } else {
                    throw new Error('Token yanıt içerisinde bulunamadı.');
                }
            } else {
                // Hata mesajı çıkarma
                let errorMsg = 'Invalid username or password.';
                if (data && data.exceptionDetails && data.exceptionDetails.message) {
                    errorMsg = typeof data.exceptionDetails.message === 'string'
                        ? data.exceptionDetails.message
                        : JSON.stringify(data.exceptionDetails.message);
                } else if (data && data.message) {
                    errorMsg = data.message;
                }

                errorBanner.textContent = errorMsg;
                errorBanner.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Login Error:', error);
            errorBanner.textContent = 'Giriş yapılamadı. Lütfen bilgilerinizi kontrol edin.';
            errorBanner.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Continue</span>';
        }
    });
</script>

</body>
</html>
