<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Comments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<header class="w-full max-w-3xl mx-auto px-6 py-6 border-b border-zinc-200/60 flex justify-between items-center bg-zinc-50/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-zinc-900 rounded-md flex items-center justify-center">
            <div class="w-2.5 h-2.5 bg-white"></div>
        </div>
        <span class="font-semibold tracking-tight text-base text-zinc-900">todo.api</span>
        <span class="text-xs bg-zinc-200/60 text-zinc-700 px-2 py-0.5 rounded-full font-medium ml-2">Comments</span>
    </div>

    <div class="flex items-center gap-4">
        <a th:href="@{/dashboard}" class="text-xs text-zinc-500 hover:text-zinc-900 font-medium transition-colors">
            ← Back to Dashboard
        </a>
    </div>
</header>

<main class="w-full max-w-3xl mx-auto px-6 py-8 flex-1">

    <div th:if="${errorMsg}" th:text="${errorMsg}" class="mb-6 p-4 rounded-xl text-xs font-medium bg-red-50 border border-red-200 text-red-600 shadow-sm"></div>
    <div th:if="${successMsg}" th:text="${successMsg}" class="mb-6 p-4 rounded-xl text-xs font-medium bg-emerald-50 border border-emerald-200 text-emerald-700 shadow-sm"></div>

    <div class="bg-white border border-zinc-200/80 rounded-xl p-5 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)] mb-6">
        <h3 class="text-sm font-semibold text-zinc-900 mb-4">Add Comment</h3>
        <form th:action="@{/dashboard/todo/{encodedId}/comment(encodedId=${encodedId})}" method="post" class="space-y-3">
            <textarea name="content" required maxlength="500" rows="2" placeholder="Write your comment..."
                      class="w-full px-3.5 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-zinc-900 resize-none"></textarea>
            <div class="flex justify-end">
                <button type="submit" class="bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium px-4 py-2 rounded-lg transition-all shadow-sm">
                    Send
                </button>
            </div>
        </form>
    </div>

    <div th:if="${comments != null && !comments.isEmpty()}" class="space-y-3">
        <div th:each="comment : ${comments}" class="bg-white border border-zinc-200/80 rounded-xl p-4 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-zinc-900" th:text="${comment.username}">username</span>
                <span class="text-[10px] text-zinc-400" th:text="${comment.createdAt != null ? #temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm') : ''}">date</span>
            </div>
            <p class="text-sm text-zinc-600" th:text="${comment.content}">comment content</p>
        </div>
    </div>

    <div th:if="${comments == null || comments.isEmpty()}" class="text-center py-16 border border-dashed border-zinc-300 rounded-2xl bg-white/50">
        <div class="w-10 h-10 bg-zinc-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span class="text-zinc-400 text-lg">💬</span>
        </div>
        <h3 class="text-sm font-semibold text-zinc-900">No comments yet</h3>
        <p class="text-xs text-zinc-500 mt-1">Be the first to leave a comment.</p>
    </div>

</main>

</body>
</html>
