<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-zinc-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo API — Team Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-full bg-zinc-50 text-zinc-900 font-sans antialiased bg-grid flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

<header class="w-full max-w-6xl mx-auto px-6 py-6 border-b border-zinc-200/60 flex justify-between items-center bg-zinc-50/80 backdrop-blur-sm sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-zinc-900 rounded-md flex items-center justify-center">
            <div class="w-2.5 h-2.5 bg-white"></div>
        </div>
        <span class="font-semibold tracking-tight text-base text-zinc-900">todo.api</span>
        <span class="text-xs bg-zinc-200/60 text-zinc-700 px-2 py-0.5 rounded-full font-medium ml-2">Team Tasks</span>
    </div>

    <div class="flex items-center gap-4">
        <a th:href="@{/teams}" class="text-xs text-zinc-500 hover:text-zinc-900 font-medium transition-colors">
            ← Back to Teams
        </a>
    </div>
</header>

<main class="w-full max-w-6xl mx-auto px-6 py-8 flex-1">

    <div class="mb-8 pb-6 border-b border-zinc-200/60">
        <h1 class="text-2xl font-bold tracking-tight text-zinc-900" th:text="${team.name} + ' Tasks'">Team Tasks</h1>
        <p class="text-xs text-zinc-500 mt-1" th:text="${tasks.size()} + ' tasks'">0 tasks</p>
    </div>

    <div th:if="${tasks != null && !tasks.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div th:each="task : ${tasks}" class="bg-white border border-zinc-200/80 rounded-xl p-5 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)]">
            <div class="flex items-center gap-1.5 flex-wrap mb-2">
                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-100 text-zinc-700 rounded-md"
                      th:text="${task.taskType}">TYPE</span>

                <span th:if="${task.status.name() == 'PENDING'}"
                      class="text-[10px] font-medium px-2 py-0.5 rounded border shadow-sm bg-amber-50 text-amber-600 border-amber-200">PENDING</span>
                <span th:if="${task.status.name() == 'IN_PROGRESS'}"
                      class="text-[10px] font-medium px-2 py-0.5 rounded border shadow-sm bg-blue-50 text-blue-600 border-blue-200">IN PROGRESS</span>
                <span th:if="${task.status.name() == 'COMPLETED'}"
                      class="text-[10px] font-medium px-2 py-0.5 rounded border shadow-sm bg-emerald-50 text-emerald-600 border-emerald-200">COMPLETED</span>
                <span th:if="${task.status.name() == 'FAILED'}"
                      class="text-[10px] font-medium px-2 py-0.5 rounded border shadow-sm bg-red-50 text-red-600 border-red-200">FAILED</span>

                <span th:if="${task.assignedToUsername}"
                      class="text-[10px] font-medium bg-purple-50 text-purple-600 px-2 py-0.5 rounded border border-purple-100 shadow-sm"
                      th:text="'🎯 ' + ${task.assignedToUsername}"></span>
            </div>
            <h4 class="font-semibold text-sm text-zinc-900 mb-1" th:text="${task.title}">Title</h4>
            <p class="text-xs text-zinc-500 mb-3" th:text="${task.description ?: 'No description'}">Desc</p>
            <div class="pt-3 border-t border-zinc-100 text-[11px] text-zinc-400">
                <span>🎯 Due: <strong class="text-zinc-600" th:text="${task.dueDate ?: 'N/A'}">Date</strong></span>
            </div>
        </div>
    </div>

    <div th:if="${tasks == null || tasks.isEmpty()}" class="text-center py-16 border border-dashed border-zinc-300 rounded-2xl bg-white/50">
        <p class="text-sm text-zinc-500">No tasks in this team yet.</p>
    </div>
</main>

</body>
</html>
